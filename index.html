
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>محاسبه کار فرآیند هم‌دما</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b1120;
    --surface: #131c2e;
    --surface-light: #1b2740;
    --border: #29364d;
    --text: #e8edf5;
    --muted: #98a7bd;
    --accent: #60a5fa;
    --green: #34d399;
    --red: #fb7185;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    line-height: 1.8;
}

.container {
    width: min(100% - 28px, 880px);
    margin: 0 auto;
    padding: 42px 0;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 600;
    margin: 0 0 8px;
}

header p {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
}

.calculator {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
}

.card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
}

.card h2 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 22px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    direction: ltr;
    text-align: left;
    outline: none;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgb(96 165 250 / 12%);
}

button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #07111f;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #3b82f6;
    color: white;
}

.result-main {
    text-align: center;
    background: var(--surface-light);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 12px;
    margin-bottom: 18px;
}

.result-main span {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
}

.result-main strong {
    display: block;
    color: var(--green);
    font-family: 'Inter', sans-serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: -1px;
    direction: ltr;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
}

.result-main small {
    color: var(--muted);
    font-size: 12px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}

.result-row:last-of-type {
    border-bottom: none;
}

.result-row span {
    color: var(--muted);
    font-size: 13px;
}

.result-row strong {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    direction: ltr;
    text-align: left;
    overflow-wrap: anywhere;
}

#statusText {
    margin-top: 16px;
    padding: 9px 10px;
    border-radius: 8px;
    text-align: center;
    background: var(--surface-light);
    color: var(--muted);
    font-size: 13px;
}

#statusText.success {
    color: var(--green);
}

#statusText.error {
    color: var(--red);
}

.formula {
    margin-top: 20px;
    padding: 16px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 13px;
}

.formula strong {
    display: block;
    margin-bottom: 5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 21px;
    font-weight: 500;
    direction: ltr;
}

footer {
    text-align: center;
    margin-top: 22px;
    color: var(--muted);
    font-size: 12px;
}

@media (max-width: 650px) {
    .container {
        padding: 28px 0;
    }

    header {
        margin-bottom: 22px;
    }

    .calculator {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .card {
        padding: 20px;
    }

    .result-main strong {
        font-size: clamp(28px, 8vw, 36px);
    }
}
</style>
</head>

<body>
<main class="container">
    <header>
        <h1>محاسبه کار در فرآیند هم‌دما</h1>
        <p>ترمودینامیک مهندسی شیمی</p>
    </header>

    <section class="calculator">
        <div class="card">
            <h2>مشخصات گاز</h2>

            <form id="workForm">
                <div class="form-group">
                    <label for="moles">تعداد مول گاز (mol)</label>
                    <input id="moles" type="number" min="0.000001"
                           step="any" value="1" required>
                </div>

                <div class="form-group">
                    <label for="temperature">دما (K)</label>
                    <input id="temperature" type="number" min="0.000001"
                           step="any" value="300" required>
                </div>

                <div class="form-group">
                    <label for="initialVolume">حجم اولیه (m³)</label>
                    <input id="initialVolume" type="number" min="0.000001"
                           step="any" value="0.01" required>
                </div>

                <div class="form-group">
                    <label for="finalVolume">حجم نهایی (m³)</label>
                    <input id="finalVolume" type="number" min="0.000001"
                           step="any" value="0.02" required>
                </div>

                <button type="submit">محاسبه کار</button>
            </form>
        </div>

        <div class="card" aria-live="polite">
            <h2>نتیجه محاسبه</h2>

            <div class="result-main">
                <span>کار انجام‌شده توسط گاز</span>
                <strong id="resultValue">—</strong>
                <small>J</small>
            </div>

            <div class="result-row">
                <span>کار بر حسب کیلوژول</span>
                <strong id="kjValue">—</strong>
            </div>

            <div class="result-row">
                <span>نسبت حجم‌ها (V₂/V₁)</span>
                <strong id="ratioValue">—</strong>
            </div>

            <div class="result-row">
                <span>لگاریتم طبیعی نسبت</span>
                <strong id="logValue">—</strong>
            </div>

            <div class="result-row">
                <span>مقدار nRT</span>
                <strong id="thermalValue">—</strong>
            </div>

            <div id="statusText">مقادیر را وارد کنید.</div>
        </div>
    </section>

    <div class="formula">
        <strong>W = nRT ln(V₂/V₁)</strong>
        فرض: گاز ایده‌آل و دمای ثابت
    </div>

    <footer>ثابت گازها: R = 8.314462618 J/(mol·K)</footer>
</main>

<script>
const form = document.getElementById("workForm");
const statusText = document.getElementById("statusText");

const formatNumber = (value, digits = 2) =>
    value.toLocaleString("en-US", {
        maximumFractionDigits: digits
    });

form.addEventListener("submit", function (event) {
    event.preventDefault();

    const n = Number(document.getElementById("moles").value);
    const T = Number(document.getElementById("temperature").value);
    const V1 = Number(document.getElementById("initialVolume").value);
    const V2 = Number(document.getElementById("finalVolume").value);

    const values = [n, T, V1, V2];

    if (!values.every(Number.isFinite) ||
        values.some(value => value <= 0)) {
        statusText.textContent = "همه مقادیر باید بزرگ‌تر از صفر باشند.";
        statusText.className = "error";
        return;
    }

    const R = 8.314462618;
    const ratio = V2 / V1;
    const logarithm = Math.log(ratio);
    const thermalTerm = n * R * T;
    const work = thermalTerm * logarithm;

    document.getElementById("resultValue").textContent =
        formatNumber(work);

    document.getElementById("kjValue").textContent =
        formatNumber(work / 1000, 5) + " kJ";

    document.getElementById("ratioValue").textContent =
        ratio.toFixed(6);

    document.getElementById("logValue").textContent =
        logarithm.toFixed(6);

    document.getElementById("thermalValue").textContent =
        formatNumber(thermalTerm) + " J";

    if (V2 > V1) {
        statusText.textContent = "انبساط — کار مثبت";
    } else if (V2 < V1) {
        statusText.textContent = "تراکم — کار منفی";
    } else {
        statusText.textContent = "بدون تغییر حجم — کار صفر";
    }

    statusText.className = "success";
});
</script>
</body>
</html>
